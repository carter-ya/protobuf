name: Legacy compatibility
on: [push, pull_request]
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.27.x']
        protoc: ['21.8', '36.2']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Install pinned protoc release
        env:
          PROTOC_RELEASE: ${{ matrix.protoc }}
        run: |
          curl --fail --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - run: sh compat/check.sh
      - run: sh compat/check-optional.sh
      - run: sh compat/check-entrypoints.sh
      - run: sh compat/check-features.sh
