name: Legacy compatibility
on: [push, pull_request]
jobs:
  proto-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: compat/proto-format-requirements.txt
      - run: python -m pip install -r compat/proto-format-requirements.txt
      - run: python compat/format-proto.py --check

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', '1.27.x']
        protoc: ['21.8', '36.2']
        include:
          - go: '1.15.15'
            protoc: '36.2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Install pinned protoc release
        env:
          PROTOC_RELEASE: ${{ matrix.protoc }}
        run: |
          curl --fail --location --retry 3 "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_RELEASE}/protoc-${PROTOC_RELEASE}-linux-x86_64.zip" -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - run: sh compat/check.sh
      - run: sh compat/check-optional.sh
      - run: sh compat/check-entrypoints.sh
      - run: sh compat/check-features.sh
      - run: sh compat/check-gostring.sh
      - run: sh compat/check-wkt-metadata.sh
      - run: sh compat/check-required.sh
      - run: sh compat/check-editions-plugins.sh
      - run: sh compat/check-editions-fast.sh
      - run: sh compat/check-editions.sh

  downstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - name: Install pinned protoc release
        run: |
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: sh compat/check-downstream.sh

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned protoc release
        run: |
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conformance/bin
          key: conformance-36.2-ubuntu24.04-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compat/conformance/build-runner.py', 'compat/conformance/runner-main.cc') }}
      - name: Build pinned upstream conformance suites
        run: python3 compat/conformance/build-runner.py "$RUNNER_TEMP/conformance"
      - name: Check modern conformance baseline
        env:
          PROTOBUF_CONFORMANCE_SOURCE: ${{ runner.temp }}/conformance/protobuf-36.2
          PROTOBUF_CONFORMANCE_RUNNER: ${{ runner.temp }}/conformance/bin/conformance_test_runner
          CONFORMANCE_OUTPUT: ${{ runner.temp }}/conformance-report
        run: sh compat/check-conformance.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance-report
          if-no-files-found: error
