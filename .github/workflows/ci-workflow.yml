name: Continuous Integration
on:
  push:
    branches:
      - ghworkflow
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    name: go ${{ matrix.go_version }} - pb-${{ matrix.protobuf_version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gopath/src/github.com/gogo/protobuf
    strategy:
      matrix:
        go_version: ['1.15.15', '1.23.x']
        protobuf_version: [3.14.0, 3.0.2, 2.6.1]
      fail-fast: false
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          path: gopath/src/github.com/gogo/protobuf
          fetch-depth: 0
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
          cache: false

      - name: Setup protoc
        env:
          PROTOBUF_VERSION: ${{ matrix.protobuf_version }}
        run: ./install-protobuf.sh

      - name: Record historical compiler
        run: |
          echo "HISTORICAL_PROTOC=$HOME/bin/protoc" >> "$GITHUB_ENV"
          "$HOME/bin/protoc" --version
      - name: Install compiler for current descriptor sources
        run: |
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip -o "$RUNNER_TEMP/current-protoc.zip"
          unzip -q "$RUNNER_TEMP/current-protoc.zip" -d "$RUNNER_TEMP/current-protoc"
          echo "CURRENT_PROTOC=$RUNNER_TEMP/current-protoc/bin/protoc" >> "$GITHUB_ENV"
      - name: Verify all five backends with valid historical schemas
        run: sh compat/historical/run.sh "$HISTORICAL_PROTOC"
      - name: Full root tests, purego and static analysis
        run: sh compat/historical/full-suite.sh "$CURRENT_PROTOC"
      - name: Diff check
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
